name: Build and Package DMG

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release
        run: |
          xcodebuild -project StockBar.xcodeproj \
            -scheme StockBar \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          APP="build/Build/Products/Release/StockBar.app"
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname StockBar -srcfolder dmg -ov -format UDZO StockBar.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: StockBar.dmg
          path: StockBar.dmg